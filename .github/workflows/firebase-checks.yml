name: Firebase experiment checks
on:
  push:
    branches: [test-firebase]
    paths: ['firebase-experiment/**', '.github/workflows/firebase-checks.yml']
  pull_request:
    paths: ['firebase-experiment/**', '.github/workflows/firebase-checks.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s firebase-experiment/tests -v

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node firebase-experiment/tests/browser.cjs

